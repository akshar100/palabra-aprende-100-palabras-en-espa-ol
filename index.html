<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#0D1117">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Palabra">
  <meta name="description" content="Aprende 100 palabras esenciales en español con pistas de emojis, oraciones de contexto y quizzes interactivos.">
  <title>Palabra - Aprende 100 Palabras en Español</title>
  
  <link rel="manifest" href="./manifest.json">
  <link rel="icon" type="image/svg+xml" href="./icon.svg">
  <link rel="apple-touch-icon" href="./icon-192.png">
  
  <style>
    :root {
      --bg: #0D1117;
      --card-bg: #161B22;
      --card-border: #30363D;
      --text: #F0F6FC;
      --text-muted: #8B949E;
      --primary: #F59E0B;
      --primary-hover: #D97706;
      --primary-light: rgba(245, 158, 11, 0.15);
      --success: #10B981;
      --success-bg: rgba(16, 185, 129, 0.2);
      --error: #EF4444;
      --error-bg: rgba(239, 68, 68, 0.2);
      --accent: #6366F1;
      --radius: 20px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow-x: hidden;
    }

    .app-container {
      width: 100%;
      max-width: 480px;
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      position: relative;
      background: radial-gradient(circle at 50% 0%, #1c2333 0%, #0D1117 75%);
      box-shadow: 0 0 40px rgba(0, 0, 0, 0.6);
      padding: env(safe-area-inset-top, 16px) 16px env(safe-area-inset-bottom, 16px);
    }

    /* Top Action Bar */
    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 4px 8px;
      position: relative;
      z-index: 10;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      font-weight: 800;
      font-size: 1.25rem;
      letter-spacing: -0.5px;
      color: #fff;
    }

    .brand-icon {
      width: 36px;
      height: 36px;
      background: linear-gradient(135deg, #F59E0B, #EC4899);
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
      box-shadow: 0 4px 12px rgba(245, 158, 11, 0.35);
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .btn-icon {
      background: #21262D;
      border: 1px solid var(--card-border);
      color: var(--text);
      min-width: 44px;
      height: 44px;
      border-radius: 12px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 1.1rem;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .btn-icon:active {
      transform: scale(0.92);
      background: #30363D;
    }

    .btn-install {
      background: linear-gradient(135deg, #10B981, #059669);
      color: #fff;
      font-weight: 700;
      font-size: 0.82rem;
      padding: 0 14px;
      height: 40px;
      border-radius: 12px;
      border: none;
      cursor: pointer;
      display: none;
      align-items: center;
      gap: 6px;
      box-shadow: 0 4px 14px rgba(16, 185, 129, 0.35);
      animation: pulse 2s infinite;
    }

    @keyframes pulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.04); }
    }

    /* Progress & Stats */
    .stats-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 4px 6px;
      font-size: 0.85rem;
      font-weight: 600;
      color: var(--text-muted);
    }

    .stat-pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: #1c2128;
      border: 1px solid var(--card-border);
      padding: 5px 12px;
      border-radius: 20px;
      color: #F0F6FC;
    }

    .stat-pill span {
      color: var(--primary);
      font-weight: 700;
    }

    .progress-track {
      width: 100%;
      height: 8px;
      background: #21262D;
      border-radius: 8px;
      overflow: hidden;
      margin: 4px 0 16px;
      position: relative;
    }

    .progress-fill {
      height: 100%;
      background: linear-gradient(90deg, #F59E0B, #EC4899);
      border-radius: 8px;
      transition: width 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    /* Main Word Card */
    .main-content {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      position: relative;
      margin-bottom: 12px;
    }

    .word-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: var(--radius);
      padding: 28px 20px;
      text-align: center;
      box-shadow: 0 12px 30px rgba(0, 0, 0, 0.4);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 14px;
      position: relative;
      overflow: hidden;
    }

    .word-card::before {
      content: "";
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 4px;
      background: linear-gradient(90deg, #F59E0B, #EC4899, #6366F1);
    }

    .category-badge {
      background: var(--primary-light);
      color: var(--primary);
      text-transform: uppercase;
      letter-spacing: 1.5px;
      font-size: 0.7rem;
      font-weight: 800;
      padding: 4px 12px;
      border-radius: 20px;
    }

    .emoji-clue {
      font-size: 4.2rem;
      line-height: 1.1;
      filter: drop-shadow(0 8px 16px rgba(0,0,0,0.4));
      cursor: pointer;
      transition: transform 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    .emoji-clue:hover {
      transform: scale(1.12) rotate(4deg);
    }

    .spanish-word {
      font-size: 2.5rem;
      font-weight: 800;
      color: #fff;
      letter-spacing: -0.5px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
    }

    .btn-pronounce {
      background: rgba(245, 158, 11, 0.15);
      border: 1px solid rgba(245, 158, 11, 0.3);
      color: var(--primary);
      width: 42px;
      height: 42px;
      border-radius: 50%;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-size: 1.15rem;
      transition: all 0.2s ease;
    }

    .btn-pronounce:hover, .btn-pronounce:active {
      background: var(--primary);
      color: #000;
      transform: scale(1.1);
    }

    .sentence-box {
      background: rgba(255, 255, 255, 0.03);
      border: 1px dashed var(--card-border);
      border-radius: 14px;
      padding: 14px 16px;
      margin-top: 4px;
      width: 100%;
    }

    .sentence-text {
      font-size: 1rem;
      line-height: 1.45;
      color: #E6EDF3;
      font-weight: 500;
    }

    .sentence-sub {
      font-size: 0.75rem;
      color: var(--text-muted);
      margin-top: 4px;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    /* Action Controls */
    .controls {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .btn-primary {
      background: linear-gradient(135deg, #F59E0B, #D97706);
      color: #111;
      font-weight: 800;
      font-size: 1.1rem;
      min-height: 52px;
      border-radius: 16px;
      border: none;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      cursor: pointer;
      box-shadow: 0 6px 20px rgba(245, 158, 11, 0.3);
      transition: all 0.2s ease;
    }

    .btn-primary:active {
      transform: scale(0.97);
    }

    .secondary-nav {
      display: flex;
      gap: 10px;
    }

    .btn-secondary {
      flex: 1;
      min-height: 46px;
      background: #21262D;
      border: 1px solid var(--card-border);
      color: var(--text);
      font-weight: 600;
      font-size: 0.95rem;
      border-radius: 14px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      transition: all 0.2s ease;
    }

    .btn-secondary:active {
      transform: scale(0.96);
      background: #30363D;
    }

    /* Quiz Stage */
    .quiz-container {
      display: none;
      flex-direction: column;
      gap: 12px;
      width: 100%;
      animation: fadeIn 0.3s ease;
    }

    .quiz-title {
      font-size: 0.9rem;
      font-weight: 700;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 1px;
      text-align: center;
      margin-bottom: 2px;
    }

    .quiz-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .quiz-btn {
      min-height: 58px;
      background: #1C2128;
      border: 2px solid var(--card-border);
      border-radius: 14px;
      color: #F0F6FC;
      font-size: 1.05rem;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 8px 12px;
      line-height: 1.25;
      transition: all 0.15s ease;
    }

    .quiz-btn:active {
      transform: scale(0.95);
    }

    .quiz-btn.correct {
      background: var(--success-bg) !important;
      border-color: var(--success) !important;
      color: #34D399 !important;
      animation: correctPop 0.4s ease;
    }

    .quiz-btn.incorrect {
      background: var(--error-bg) !important;
      border-color: var(--error) !important;
      color: #F87171 !important;
      animation: shake 0.4s ease;
    }

    @keyframes correctPop {
      0% { transform: scale(1); }
      50% { transform: scale(1.08); }
      100% { transform: scale(1); }
    }

    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      20%, 60% { transform: translateX(-6px); }
      40%, 80% { transform: translateX(6px); }
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* Animated Animals Celebrations */
    .animals-burst-container {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      pointer-events: none;
      z-index: 999;
      overflow: hidden;
    }

    .burst-animal {
      position: absolute;
      font-size: 3.5rem;
      user-select: none;
      pointer-events: none;
      will-change: transform, opacity;
      animation: flyAnimal 1.6s cubic-bezier(0.2, 0.8, 0.2, 1) forwards;
    }

    @keyframes flyAnimal {
      0% {
        opacity: 0;
        transform: translate(var(--startX), var(--startY)) scale(0.3) rotate(0deg);
      }
      20% {
        opacity: 1;
        transform: translate(var(--midX), var(--midY)) scale(1.35) rotate(var(--rot1));
      }
      85% {
        opacity: 1;
        transform: translate(var(--endX), var(--endY)) scale(1.1) rotate(var(--rot2));
      }
      100% {
        opacity: 0;
        transform: translate(var(--endX), calc(var(--endY) + 60px)) scale(0.6) rotate(var(--rot3));
      }
    }

    /* Full Drawer (Words List & Filter) */
    .drawer {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      max-width: 480px;
      margin: 0 auto;
      height: 82vh;
      background: #161B22;
      border-top: 2px solid var(--card-border);
      border-radius: 24px 24px 0 0;
      box-shadow: 0 -10px 40px rgba(0, 0, 0, 0.8);
      z-index: 1000;
      transform: translateY(105%);
      transition: transform 0.35s cubic-bezier(0.32, 0.72, 0, 1);
      display: flex;
      flex-direction: column;
      padding: 16px;
    }

    .drawer.open {
      transform: translateY(0);
    }

    .drawer-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-bottom: 12px;
      border-bottom: 1px solid var(--card-border);
    }

    .drawer-title {
      font-size: 1.2rem;
      font-weight: 800;
    }

    .drawer-search {
      margin: 12px 0;
      width: 100%;
      height: 44px;
      background: #0D1117;
      border: 1px solid var(--card-border);
      border-radius: 12px;
      color: #fff;
      font-size: 1rem;
      padding: 0 14px;
      outline: none;
    }

    .drawer-search:focus {
      border-color: var(--primary);
    }

    .words-catalog {
      flex: 1;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 8px;
      padding-right: 4px;
    }

    .catalog-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 14px;
      background: #21262D;
      border-radius: 12px;
      cursor: pointer;
      border: 1px solid transparent;
      transition: all 0.2s;
    }

    .catalog-item.active {
      border-color: var(--primary);
      background: rgba(245, 158, 11, 0.1);
    }

    .catalog-item.mastered {
      border-left: 4px solid var(--success);
    }

    .drawer-backdrop {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(0, 0, 0, 0.75);
      z-index: 998;
      display: none;
      backdrop-filter: blur(4px);
    }

    .drawer-backdrop.open {
      display: block;
    }

    /* Toast Notification */
    .toast {
      position: fixed;
      bottom: 30px;
      left: 50%;
      transform: translateX(-50%) translateY(100px);
      background: #F59E0B;
      color: #000;
      font-weight: 700;
      font-size: 0.95rem;
      padding: 12px 24px;
      border-radius: 30px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.5);
      opacity: 0;
      transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
      z-index: 2000;
      pointer-events: none;
    }

    .toast.show {
      transform: translateX(-50%) translateY(0);
      opacity: 1;
    }
  </style>
</head>
<body>

  <div class="app-container">
    <!-- Header -->
    <header>
      <div class="brand">
        <div class="brand-icon">🇪🇸</div>
        <div>Palabra</div>
      </div>
      <div class="header-actions">
        <button id="installBtn" class="btn-install" title="Instalar App">
          📲 Instalar
        </button>
        <button id="btnList" class="btn-icon" title="Ver catálogo de 100 palabras">
          📚
        </button>
        <button id="btnSoundToggle" class="btn-icon" title="Activar/Silenciar sonido">
          🔊
        </button>
      </div>
    </header>

    <!-- Progress & Counters -->
    <div class="stats-bar">
      <div class="stat-pill">Palabra: <span id="wordIndexLabel">1</span> / 100</div>
      <div class="stat-pill">Dominadas: <span id="masteredCountLabel">0</span> 🏆</div>
      <div class="stat-pill">Racha: <span id="streakLabel">0</span> 🔥</div>
    </div>
    
    <div class="progress-track">
      <div id="progressFill" class="progress-fill" style="width: 1%;"></div>
    </div>

    <!-- Main Card Content -->
    <div class="main-content">
      <div class="word-card" id="wordCard">
        <span class="category-badge" id="categoryBadge">ANIMALES</span>
        
        <div class="emoji-clue" id="emojiClue" title="Toca para animar">🐶🐾</div>
        
        <div class="spanish-word">

          <button class="btn-pronounce" id="btnPronounce" title="Pronunciar en español">
            🔊
          </button>
        </div>

        <div class="sentence-box">
          <div class="sentence-sub">Oración de ejemplo</div>
          <div class="sentence-text" id="sentenceText">El perro ladra en el parque por la mañana.</div>
        </div>
      </div>
    </div>

    <!-- Navigation / Quiz Control Area -->
    <div class="controls">
      <!-- Flashcard mode primary action -->
      <button class="btn-primary" id="btnNextQuiz">
        <span>Siguiente: ¿Qué significa?</span> ➡️
      </button>

      <!-- Quiz mode: 4 random English options -->
      <div class="quiz-container" id="quizContainer">
        <div class="quiz-title">Selecciona la traducción correcta en inglés:</div>
        <div class="quiz-grid" id="quizGrid">
          <!-- 4 option buttons dynamically filled -->
        </div>
      </div>

      <div class="secondary-nav">
        <button class="btn-secondary" id="btnPrev">
          ⬅️ Anterior
        </button>
        <button class="btn-secondary" id="btnSkip">
          Saltar ⏩
        </button>
      </div>
    </div>
  </div>

  <!-- Words Catalog Drawer -->
  <div class="drawer-backdrop" id="drawerBackdrop"></div>
  <div class="drawer" id="wordsDrawer">
    <div class="drawer-header">
      <div class="drawer-title">100 Palabras en Español</div>
      <button class="btn-icon" id="btnCloseDrawer">✕</button>
    </div>
    <input type="text" class="drawer-search" id="drawerSearch" placeholder="Buscar palabra en español o inglés...">
    <div class="words-catalog" id="wordsCatalog"></div>
  </div>

  <!-- Celebratory Burst Area -->
  <div class="animals-burst-container" id="animalsContainer"></div>

  <!-- Toast Notification -->
  <div class="toast" id="toast">¡Correcto! 🎉</div>

    // Web Audio Synthesizer
    let audioCtx = null;
    function getAudioContext() {
      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      }
      if (audioCtx.state === 'suspended') {
        audioCtx.resume();
      }
      return audioCtx;
    }

    function playSuccessSound() {
      if (!soundEnabled) return;
      try {
        const ctx = getAudioContext();
        const now = ctx.currentTime;
        const notes = [523.25, 659.25, 783.99, 1046.50];
        notes.forEach((freq, idx) => {
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.type = 'triangle';
          osc.frequency.setValueAtTime(freq, now + idx * 0.08);
          gain.gain.setValueAtTime(0.001, now + idx * 0.08);
          gain.gain.exponentialRampToValueAtTime(0.3, now + idx * 0.08 + 0.02);
          gain.gain.exponentialRampToValueAtTime(0.0001, now + idx * 0.08 + 0.5);
          osc.connect(gain);
          gain.connect(ctx.destination);
          osc.start(now + idx * 0.08);
          osc.stop(now + idx * 0.08 + 0.55);
        });
      } catch (e) {
        console.warn('Audio error:', e);
      }
    }

    function playErrorSound() {
      if (!soundEnabled) return;
      try {
        const ctx = getAudioContext();
        const now = ctx.currentTime;
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(220, now);
        osc.frequency.linearRampToValueAtTime(140, now + 0.25);
        gain.gain.setValueAtTime(0.2, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.25);
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start(now);
        osc.stop(now + 0.26);
      } catch (e) {
        console.warn(e);
      }
    }

      isQuizMode = true;

      quizContainer.style.display = 'flex';

      const options = [current, ...shuffled].sort(() => 0.5 - Math.random());

      quizGrid.innerHTML = '';

        btn.className = 'quiz-btn';

    }

    function handleAnswer(isCorrect, buttonElem) {
      const allBtns = quizGrid.querySelectorAll('.quiz-btn');
      allBtns.forEach(b => b.disabled = true);

      if (isCorrect) {
        buttonElem.classList.add('correct');
        masteredWords.add(WORDS[currentIndex].id);
        currentStreak++;
        playSuccessSound();
        triggerAnimalsCelebration();
        showToast('¡Excelente! 🎉 ' + WORDS[currentIndex].en);

        setTimeout(() => {
          goNext();
        }, 1400);
      } else {
        buttonElem.classList.add('incorrect');
        currentStreak = 0;
        playErrorSound();
        showToast('¡Casi! Inténtalo otra vez 🤔');

        const current = WORDS[currentIndex];
        allBtns.forEach(b => {
          if (b.textContent === current.en) {
            b.classList.add('correct');
          }
        });

        setTimeout(() => {
          allBtns.forEach(b => b.disabled = false);
        }, 1200);
      }

      masteredCountLabel.textContent = masteredWords.size;
      streakLabel.textContent = currentStreak;
      saveState();
    }

    function triggerAnimalsCelebration() {
      const count = 14;
      const rect = wordCard.getBoundingClientRect();
      const centerX = rect.left + rect.width / 2;
      const centerY = rect.top + rect.height / 2;

      for (let i = 0; i < count; i++) {
        const el = document.createElement('div');
        el.className = 'burst-animal';
        el.textContent = ANIMALS[Math.floor(Math.random() * ANIMALS.length)];

        const angle = (Math.PI * 2 * i) / count + (Math.random() * 0.4 - 0.2);
        const distanceMid = 120 + Math.random() * 140;
        const distanceEnd = distanceMid + 100 + Math.random() * 120;

        const startX = centerX + 'px';
        const startY = centerY + 'px';
        const midX = (centerX + Math.cos(angle) * distanceMid) + 'px';
        const midY = (centerY + Math.sin(angle) * distanceMid - 50) + 'px';
        const endX = (centerX + Math.cos(angle) * distanceEnd) + 'px';
        const endY = (centerY + Math.sin(angle) * distanceEnd + 40) + 'px';

        el.style.setProperty('--startX', startX);
        el.style.setProperty('--startY', startY);
        el.style.setProperty('--midX', midX);
        el.style.setProperty('--midY', midY);
        el.style.setProperty('--endX', endX);
        el.style.setProperty('--endY', endY);
        el.style.setProperty('--rot1', (Math.random() * 60 - 30) + 'deg');
        el.style.setProperty('--rot2', (Math.random() * 90 - 45) + 'deg');
        el.style.setProperty('--rot3', (Math.random() * 120 - 60) + 'deg');

        animalsContainer.appendChild(el);
        setTimeout(() => el.remove(), 1700);
      }
    }

    function showToast(msg) {
      toast.textContent = msg;
      toast.classList.add('show');
      setTimeout(() => toast.classList.remove('show'), 1500);
    }

    function goNext() {
      currentIndex = (currentIndex + 1) % WORDS.length;
      renderWord();
    }

    function goPrev() {
      currentIndex = (currentIndex - 1 + WORDS.length) % WORDS.length;
      renderWord();
    }

    function renderCatalog(filterText = '') {
      wordsCatalog.innerHTML = '';
      const filter = filterText.toLowerCase().trim();

      WORDS.forEach((w, idx) => {
        if (filter && !w.es.toLowerCase().includes(filter) && !w.en.toLowerCase().includes(filter)) {
          return;
        }
        const item = document.createElement('div');
        const isMastered = masteredWords.has(w.id);
        const isActive = idx === currentIndex;

        item.className = 'catalog-item ' + (isActive ? 'active ' : '') + (isMastered ? 'mastered' : '');
        item.innerHTML = `
          <div style="display:flex; align-items:center; gap:10px;">
            <span style="font-size:1.4rem;">` + (w.emoji.split(' ')[0] || '✨') + `</span>
            <div>
              <div style="font-weight:700; color:#fff;">` + (idx + 1) + `. ` + w.es + `</div>
              <div style="font-size:0.8rem; color:var(--text-muted);">` + w.en + `</div>
            </div>
          </div>
          <div>` + (isMastered ? '🏆' : '⚪') + `</div>
        `;

        item.onclick = () => {
          currentIndex = idx;
          renderWord();
          closeDrawer();
        };
        wordsCatalog.appendChild(item);
      });
    }

    function openDrawer() {
      renderCatalog();
      wordsDrawer.classList.add('open');
      drawerBackdrop.classList.add('open');
    }

    function closeDrawer() {
      wordsDrawer.classList.remove('open');
      drawerBackdrop.classList.remove('open');
    }

    btnNextQuiz.addEventListener('click', () => {
      showQuizMode();
    });

    btnSkip.addEventListener('click', goNext);
    btnPrev.addEventListener('click', goPrev);

    btnPronounce.addEventListener('click', () => {
      speakSpanish(WORDS[currentIndex].es);
    });

    emojiClue.addEventListener('click', () => {
      speakSpanish(WORDS[currentIndex].es);
    });

    btnSoundToggle.addEventListener('click', () => {
      soundEnabled = !soundEnabled;
      updateSoundButtonUI();
      saveState();
      showToast(soundEnabled ? 'Sonido activado 🔊' : 'Sonido silenciado 🔇');
    });

    btnList.addEventListener('click', openDrawer);
    btnCloseDrawer.addEventListener('click', closeDrawer);
    drawerBackdrop.addEventListener('click', closeDrawer);
    drawerSearch.addEventListener('input', (e) => renderCatalog(e.target.value));

    // Service Worker
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js').then((reg) => {
          document.addEventListener('visibilitychange', () => {
            if (document.visibilityState === 'visible') {
              reg.update();
            }
          });
        }).catch(err => console.log('SW registration error:', err));

        navigator.serviceWorker.addEventListener('controllerchange', () => {
          window.location.reload();
        });
      });
    }

    // Install prompt
    window.addEventListener('beforeinstallprompt', (e) => {
      e.preventDefault();
      deferredPrompt = e;
      installBtn.style.display = 'inline-flex';
    });

    installBtn.addEventListener('click', async () => {
      if (deferredPrompt) {
        deferredPrompt.prompt();
        const res = await deferredPrompt.userChoice;
        if (res && res.outcome === 'accepted') {
          installBtn.style.display = 'none';
        }
        deferredPrompt = null;
      }
    });

    window.addEventListener('appinstalled', () => {
      installBtn.style.display = 'none';
      showToast('¡App instalada exitosamente! 📱');
    });

    restoreState();
    renderWord();
  </script>
</body>
</html>
